defaultIndent: "  "
removeTrailingWhitespace: 1

logFilePreferences:
  showEveryYamlRead: 1
  showAmalgamatedSettings: 1
  showDecorationStartCodeBlockTrace: 1
  showDecorationFinishCodeBlockTrace: 1
  endLogFileWith: '--------------------'

# verbatimEnvironments:
#   algorithm: 1

indentAfterItems:
  itemize: 1
  itemize*: 1
  enumerate: 1
  enumerate*: 1
  description: 1
  description*: 1
  quotation: 1
  quotation*: 1
  list: 1

modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1
  textWrapOptions:
    columns: 88
    comments:
      wrap: 1
      inheritLeadingSpace: 1
    when: after
    multipleSpacesToSingle: 1
    blocksFollow:
      other: \\\]|\\item(?:\h|\[)|\\pause|\\Indp|\\Indm|\\For
    blocksBeginWith:
      other: \\cgls|\\textbf|\\textsc
  environments:
    equation*:
      BeginStartsOnOwnLine: 4
      # BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    equation:
      BeginStartsOnOwnLine: 4
      # BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    enumerate:
      BeginStartsOnOwnLine: 4
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    itemize:
      BeginStartsOnOwnLine: 4
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    column:
      BeginStartsOnOwnLine: 4
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
