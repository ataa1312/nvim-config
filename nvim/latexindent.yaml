defaultIndent: "  "
removeTrailingWhitespace: 1

logFilePreferences:
  showEveryYamlRead: 1
  showAmalgamatedSettings: 1
  showDecorationStartCodeBlockTrace: 1
  showDecorationFinishCodeBlockTrace: 1
  endLogFileWith: '--------------------'

# verbatimEnvironments:
#   algorithm: 1

indentAfterItems:
  itemize: 1
  itemize*: 1
  enumerate: 1
  enumerate*: 1
  description: 1
  description*: 1
  quotation: 1
  quotation*: 1
  list: 1

modifyLineBreaks:
  preserveBlankLines: 1
  condenseMultipleBlankLinesInto: 1
  textWrapOptions:
    columns: 88
    comments:
      wrap: 1
      inheritLeadingSpace: 1
    when: after
    multipleSpacesToSingle: 1
    blocksFollow:
      other: |-
        (?x)
        \\\]
        |
        \\item(?:\h|\[)?\s+(?:\\textcolor\{)?
        |
        \\pause
        |
        \\Indp
        |
        \\Indm
        |
        \\For
        |
        \\begin\{figure\}
        |
        \\end\{figure\}
        |
        \\begin\{(?:assumption|corollary|example|column)\}(?:\s+\[[^\]]+\])?(?:\s*\\label\{[^}]+\})?
    blocksBeginWith:
      other: \\cgls|\\textbf|\\textsc|\\emph|\\caption\h*(?:\[\])?\h*\{ 
    # blocksEndBefore:
    #   other: 

  environments:
    equation*:
      BeginStartsOnOwnLine: 4
      # BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    equation:
      BeginStartsOnOwnLine: 4
      # BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    enumerate:
      BeginStartsOnOwnLine: 4
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    itemize:
      BeginStartsOnOwnLine: 4
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    column:
      BeginStartsOnOwnLine: 4
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    assumption:
      BeginStartsOnOwnLine: 4
      # BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4
    corollary:
      BeginStartsOnOwnLine: 4
      # BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 4

specialBeginEnd:
    ForStatement:
        begin: \\For\{[^}]+?\}
        end: \\EndFor
    FORStatement:
        begin: \\FOR\{[^}]+?\}
        end: \\ENDFOR
    WhileStatement:
        begin: \\While\{[^}]+?\}
        end: \\EndWhile
    WHILEStatement:
        begin: \\WHILE\{[^}]+?\}
        end: \\ENDWHILE
    ForAllStatement:
        begin: \\ForAll\{[^}]+?\}
        end: \\EndFor
    LoopStatement:
        begin: \\Loop
        end: \\EndLoop
    RepeatStatement:
        begin: \\Repeat
        end: \\Until\{[^}]+?\}
    ProcedureStatement:
        begin: \\Procedure\{[^}]+?\}\{[^}]+?\}
        end: \\EndProcedure
    FunctionStatement:
        begin: \\Function\{[^}]+?\}\{[^}]+?\}
        end: \\EndFunction
    IfStatement:
        begin: \\If\{[^}]+?\}
        middle:
         - \\Else
         - \\ElsIf\{[^}]+?\}
        end: \\EndIf
    IFStatement:
        begin: \\IF\{[^}]+?\}
        middle:
         - \\ELSE
         - \\ELSIF\{[^}]+?\}
        end: \\ENDIF
    specialBeforeCommand: 1
